name: Deploy Bot

on:
  push:
    branches:
      - latest

jobs:
  deploy:
    runs-on: linux_amd64

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Ensure bot folder exists
        run: mkdir -p /var/izuna/izuna-gitea-runner/bot

      - name: Sync bot code
        working-directory: /var/izuna/izuna-gitea-runner/bot
        run: |
          if [ ! -d ".git" ]; then
            git clone https://gitea.owomnipotent.owo/Shiruaru/Izuna-Hatsuse.git .
          else
            git reset --hard
            git pull origin latest
          fi

      - name: Run database migrations
        working-directory: /var/izuna/izuna-gitea-runner/bot
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Install dependencies
        working-directory: /var/izuna/izuna-gitea-runner/bot
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install

      - name: Debug env var length
        run: |
            echo "Length: ${#DISCORD_CLIENT_ID}"
        env:
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}

      - name: Restart bot with pm2
        working-directory: /var/izuna/izuna-gitea-runner/bot
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          pm2 restart izuna || pm2 start ecosystem.config.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          WANIKANI_API_KEY: ${{ secrets.WANIKANI_API_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
