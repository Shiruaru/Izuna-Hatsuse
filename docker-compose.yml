version: '3.8'
name: izuna
services:
    postgres:
        image: postgres:latest
        container_name: izuna-dev
        restart: always
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        ports:
            - "5432:5432"
        volumes:
            - pg_data:/var/lib/postgresql/data

volumes:
    pg_data: {}
